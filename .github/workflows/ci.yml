name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npx tsc --noEmit

  build-tokens:
    name: Build tokens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run build:tokens
      - uses: actions/upload-artifact@v4
        with:
          name: token-build
          path: build/

  build-storybook:
    name: Build Storybook
    runs-on: ubuntu-latest
    needs: build-tokens
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - uses: actions/download-artifact@v4
        with:
          name: token-build
          path: build/
      - run: npm run build-storybook
      - uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: storybook-static/
          retention-days: 3

  # Chromatic visual regression — requires the CHROMATIC_PROJECT_TOKEN secret.
  # See Documentation/Chromatic Setup in Storybook for setup instructions.
  # Note: secrets are not available to pull_request runs from forks, so this
  # job cannot authenticate on fork-originated PRs.
  #
  # Jobs use `npm install`, not `npm ci`, deliberately. `@napi-rs/wasm-runtime`
  # declares @emnapi/{core,runtime} as optional deps, and npm omits them from
  # the lockfile when resolving on macOS. `npm ci` then fails on Linux runners
  # with "Missing: @emnapi/core@… from lock file". See #9.
  chromatic:
    name: Chromatic
    runs-on: ubuntu-latest
    needs: build-tokens
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - uses: actions/download-artifact@v4
        with:
          name: token-build
          path: build/
      - name: Run Chromatic
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          onlyChanged: true
